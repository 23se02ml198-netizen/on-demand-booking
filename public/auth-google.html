<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Google - ApexServices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Official Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body {
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #202124;
    }
    .auth-card {
      background: #ffffff;
      width: 448px;
      padding: 40px 40px 36px 40px;
      border-radius: 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      text-align: center;
    }
    .google-logo {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #202124;
      margin-bottom: 8px;
    }
    p.subtext {
      font-size: 15px;
      color: #5f6368;
      margin-bottom: 24px;
    }
    .official-btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      min-height: 44px;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: #5f6368;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #dadce0;
    }
    .divider span { padding: 0 12px; }
    .account-picker {
      border: 1px solid #dadce0;
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
      text-align: left;
    }
    .account-picker:hover {
      background: #f8f9fa;
      border-color: #d2e3fc;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #4285f4;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 18px;
    }
    .acc-name { font-weight: 500; font-size: 14px; color: #202124; }
    .acc-email { font-size: 12px; color: #5f6368; }
    .btn-submit {
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 100px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #1557b0; }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #5f6368;
      line-height: 1.5;
    }
    .footer-note a { color: #1a73e8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-card">
    <svg class="google-logo" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    <h1>Sign in with Google</h1>
    <p class="subtext">to continue to <strong>ApexServices</strong></p>

    <!-- Official Real Google Sign-In Container -->
    <div id="google-official-btn" class="official-btn-container"></div>

    <div class="divider" id="fallback-divider" style="display: none;">
      <span>OR USE DEMO ACCOUNT</span>
    </div>

    <!-- Fallback / Simulated Account Picker -->
    <div id="fallback-container">
      <div class="account-picker" id="pick-account">
        <div class="avatar">A</div>
        <div>
          <div class="acc-name">Alice Johnson</div>
          <div class="acc-email">alice.johnson@gmail.com</div>
        </div>
      </div>

      <button class="btn-submit" id="btn-continue">Continue as Alice Johnson</button>

      <div style="text-align: center; margin: 12px 0 6px;">
        <a href="#" id="use-different-account" style="font-size: 13px; color: #1a73e8; text-decoration: none; font-weight: 500;">Use another email address</a>
      </div>
    </div>

    <div class="footer-note">
      To continue, Google will share your name, email address, and profile picture with ApexServices. See ApexServices's <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a>.
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const emailParam = urlParams.get('email');
    const nameParam = urlParams.get('name');

    let email = emailParam || 'alice@example.com';
    let name = nameParam || (emailParam ? emailParam.split('@')[0].replace('.', ' ').replace(/(^\w|\s\w)/g, m => m.toUpperCase()) : 'Alice Johnson');

    document.querySelector('.acc-name').textContent = name;
    document.querySelector('.acc-email').textContent = email;
    document.querySelector('.avatar').textContent = (name || 'G').charAt(0).toUpperCase();
    document.getElementById('btn-continue').textContent = `Continue as ${name}`;

    document.getElementById('pick-account').addEventListener('click', doFallbackAuth);
    document.getElementById('btn-continue').addEventListener('click', doFallbackAuth);
    document.getElementById('use-different-account')?.addEventListener('click', (e) => {
      e.preventDefault();
      const customEmail = prompt('Enter your Google email address:');
      if (customEmail && customEmail.trim()) {
        const clean = customEmail.trim();
        const cleanName = clean.split('@')[0].replace('.', ' ').replace(/(^\w|\s\w)/g, m => m.toUpperCase());
        window.location.search = `?email=${encodeURIComponent(clean)}&name=${encodeURIComponent(cleanName)}`;
      }
    });

    // 1. Initialize Real Google Sign-In SDK
    async function initRealGoogleOAuth() {
      try {
        const res = await fetch('/api/auth/google/client-id');
        const data = await res.json();
        const clientId = data.clientId;

        if (clientId && window.google) {
          google.accounts.id.initialize({
            client_id: clientId,
            callback: handleOfficialGoogleCredential
          });

          google.accounts.id.renderButton(
            document.getElementById('google-official-btn'),
            { theme: 'outline', size: 'large', width: 360, shape: 'pill', text: 'continue_with' }
          );

          // Prompt Google One-Tap dialog
          google.accounts.id.prompt();

          // Show divider if official button is active
          document.getElementById('fallback-divider').style.display = 'flex';
        }
      } catch (err) {
        console.warn('Real Google OAuth initialization info:', err.message);
      }
    }

    // 2. Handle Official Google Credential JWT from Google
    async function handleOfficialGoogleCredential(response) {
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('apex_token', data.token);
          localStorage.setItem('apex_user', JSON.stringify(data.user));
          window.location.href = '/index.html#customer-dashboard';
        } else {
          alert('Google Sign-In failed: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        alert('Google verification error: ' + err.message);
      }
    }

    // 3. Fallback / Simulated login
    async function doFallbackAuth() {
      try {
        let res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: email === 'alice@example.com' ? 'alice123' : 'google_oauth_' + email })
        });

        if (res.status === 401 && email !== 'alice@example.com') {
          const regRes = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: name,
              email: email,
              password: 'google_oauth_' + email,
              role: 'customer'
            })
          });

          if (regRes.ok) {
            res = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: email, password: 'google_oauth_' + email })
            });
          }
        }

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('apex_token', data.token);
          localStorage.setItem('apex_user', JSON.stringify(data.user));
          window.location.href = '/index.html#customer-dashboard';
        } else {
          alert('Authentication failed: ' + (data.error || 'Please sign in or register with email.'));
        }
      } catch(e) {
        alert('Server connection error: ' + e.message);
      }
    }

    // Initialize when SDK loads
    window.addEventListener('load', () => {
      // Check every 300ms up to 3 seconds for google SDK readiness
      let checks = 0;
      const interval = setInterval(() => {
        checks++;
        if (window.google || checks > 10) {
          clearInterval(interval);
          initRealGoogleOAuth();
        }
      }, 300);
    });
  </script>
</body>
</html>
