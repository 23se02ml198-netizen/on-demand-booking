<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Google - ApexServices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body {
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #202124;
    }
    .auth-card {
      background: #ffffff;
      width: 448px;
      padding: 40px 40px 36px 40px;
      border-radius: 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      text-align: center;
    }
    .google-logo {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #202124;
      margin-bottom: 8px;
    }
    p.subtext {
      font-size: 16px;
      color: #5f6368;
      margin-bottom: 28px;
    }
    .account-picker {
      border: 1px solid #dadce0;
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: background 0.2s ease;
      text-align: left;
    }
    .account-picker:hover {
      background: #f8f9fa;
      border-color: #d2e3fc;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #4285f4;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 18px;
    }
    .acc-name { font-weight: 500; font-size: 14px; color: #202124; }
    .acc-email { font-size: 12px; color: #5f6368; }
    .btn-submit {
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 100px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #1557b0; }
    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #5f6368;
      line-height: 1.5;
    }
    .footer-note a { color: #1a73e8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-card">
    <svg class="google-logo" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    <h1>Sign in with Google</h1>
    <p class="subtext">to continue to <strong>ApexServices</strong></p>

    <div class="account-picker" id="pick-account">
      <div class="avatar">A</div>
      <div>
        <div class="acc-name">Alice Johnson</div>
        <div class="acc-email">alice.johnson@gmail.com</div>
      </div>
    </div>

    <button class="btn-submit" id="btn-continue">Continue as Alice Johnson</button>

    <div class="footer-note">
      To continue, Google will share your name, email address, and profile picture with ApexServices. See ApexServices's <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a>.
    </div>
  </div>

  <script>
    document.getElementById('pick-account').addEventListener('click', doAuth);
    document.getElementById('btn-continue').addEventListener('click', doAuth);

    async function doAuth() {
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'alice@example.com', password: 'alice123' })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('apex_token', data.token);
          localStorage.setItem('apex_user', JSON.stringify(data.user));
          window.location.href = '/index.html';
        } else {
          alert('Authentication failed.');
        }
      } catch(e) {
        alert('Server connection error.');
      }
    }
  </script>
</body>
</html>
