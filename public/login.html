<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ApexServices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
    }
    .auth-page-container {
      max-width: 460px;
      width: 100%;
      margin: 60px auto;
      padding: 0 20px;
    }
    .auth-card {
      background: var(--bg-card-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass-hover);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-header .logo-container {
      justify-content: center;
      margin-bottom: 16px;
    }
    .auth-header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .auth-footer-link {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-glass);
      font-size: 14px;
      color: var(--text-muted);
    }
    .auth-footer-link a {
      font-weight: 600;
      color: var(--primary);
    }
    .back-home-bar {
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="header-content container">
      <a href="/" class="logo-container">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span class="logo-text">Apex<span class="highlight">Services</span></span>
      </a>
      <div style="display:flex; align-items:center;">
        <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme" style="background:rgba(255,255,255,0.08); border:1px solid var(--border-glass); color:var(--text-white); width:34px; height:34px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; margin-right:10px;">🌙</button>
        <a href="/" class="btn btn-outline btn-sm">&larr; Back to Home</a>
        <a href="/register.html" class="btn btn-primary btn-sm" style="margin-left: 10px;">Register</a>
      </div>
    </div>
  </header>

  <main class="auth-page-container animate-up">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-container">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:44px; height:44px;">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1>Sign In</h1>
        <p>Access your account using your email and password</p>
      </div>

      <div id="alert-box" style="display:none; padding:12px 16px; border-radius:8px; margin-bottom:20px; font-size:14px;"></div>

      <form id="standalone-login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 12px; padding: 14px; font-size: 15px;">Sign In</button>
      </form>

      <div style="margin-top: 20px; padding: 16px; border-radius: 12px; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25);">
        <p style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); margin-bottom: 10px; text-align: center;">⚡ Instant Demo Logins</p>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-outline btn-sm demo-btn" id="demo-customer" style="flex:1; font-size: 12px; padding: 9px 4px; text-align: center;">👤 Customer</button>
          <button type="button" class="btn btn-outline btn-sm demo-btn" id="demo-provider" style="flex:1; font-size: 12px; padding: 9px 4px; text-align: center;">🛠️ Provider</button>
          <button type="button" class="btn btn-outline btn-sm demo-btn" id="demo-admin" style="flex:1; font-size: 12px; padding: 9px 4px; text-align: center; border-color: rgba(239, 68, 68, 0.4); color: var(--danger);">🔑 Admin</button>
        </div>
      </div>

      <div class="social-divider" style="display:flex; align-items:center; margin:24px 0 20px 0; color:var(--text-muted); font-size:13px;">
        <div style="flex:1; border-bottom:1px solid var(--border-glass);"></div>
        <span style="padding:0 12px;">Or continue with</span>
        <div style="flex:1; border-bottom:1px solid var(--border-glass);"></div>
      </div>

      <div class="social-actions" style="display: flex; flex-direction: column; gap: 12px; margin-top: 16px;">

        <!-- ============================================================= -->
        <!-- GOOGLE BUTTON — rendered by Google Identity Services          -->
        <!-- ============================================================= -->
        <div style="position: relative; width: 100%;">
          <button type="button" class="social-btn" id="btn-oauth-google" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px 20px; border-radius: 12px; border: 1px solid #e5e7eb; background: #ffffff; color: #1f2937; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.12);">
            <svg width="22" height="22" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span style="color:#1f2937; font-weight:600;">Continue with Google</span>
          </button>
          <div id="g_id_onload"
               data-client_id=""
               data-callback="handleGoogleCredential"
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin"
               data-type="standard"
               data-size="large"
               data-theme="outline"
               data-text="continue_with"
               data-shape="rectangular"
               data-logo_alignment="left"
               data-width="400"
               style="position:absolute; inset:0; opacity:0.01; overflow:hidden; cursor:pointer;">
          </div>
        </div>

        <button type="button" class="social-btn" id="btn-oauth-microsoft" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px 20px; border-radius: 12px; border: 1px solid #444444; background: #2f2f2f; color: #ffffff; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.25);">
          <svg width="22" height="22" viewBox="0 0 23 23">
            <path fill="#f35325" d="M1 1h10v10H1z"/>
            <path fill="#81bc06" d="M12 1h10v10H12z"/>
            <path fill="#05a6f0" d="M1 12h10v10H1z"/>
            <path fill="#ffba08" d="M12 12h10v10H12z"/>
          </svg>
          <span style="color:#ffffff; font-weight:600;">Continue with Microsoft</span>
        </button>

        <button type="button" class="social-btn" id="btn-oauth-yahoo" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px 20px; border-radius: 12px; border: 1px solid #7b1fa2; background: linear-gradient(135deg, #6001d2 0%, #4a00a0 100%); color: #ffffff; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(96,1,210,0.35);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff">
            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm-1.5 6h3l-3.5 6.5V18h-2v-5.5L4.5 6h3l2 4.5L10.5 6z"/>
          </svg>
          <span style="color:#ffffff; font-weight:600;">Continue with Yahoo</span>
        </button>
      </div>

      <div class="auth-footer-link">
        Don't have an account yet? <a href="/register.html">Register here</a>
      </div>
    </div>
  </main>

  <footer class="main-footer" style="padding: 24px 0; margin-top: 40px;">
    <div class="container" style="text-align: center; color: var(--text-muted); font-size: 13px;">
      &copy; 2026 ApexServices Inc. All rights reserved.
    </div>
  </footer>

  <script>
    const savedTheme = localStorage.getItem('theme_mode') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const toggleBtn = document.getElementById('theme-toggle-btn');
    if (toggleBtn) {
      toggleBtn.textContent = savedTheme === 'dark' ? '🌙' : '☀️';
      toggleBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme_mode', next);
        toggleBtn.textContent = next === 'dark' ? '🌙' : '☀️';
      });
    }

    const form = document.getElementById('standalone-login-form');
    const alertBox = document.getElementById('alert-box');

    const demoCustomerBtn = document.getElementById('demo-customer');
    const demoProviderBtn = document.getElementById('demo-provider');
    const demoAdminBtn = document.getElementById('demo-admin');

    if (demoCustomerBtn) {
      demoCustomerBtn.addEventListener('click', () => {
        document.getElementById('login-email').value = 'alice@example.com';
        document.getElementById('login-password').value = 'alice123';
        showAlert('Alice Johnson (Customer) credentials loaded. Click "Sign In" to proceed.', true);
      });
    }

    if (demoProviderBtn) {
      demoProviderBtn.addEventListener('click', () => {
        document.getElementById('login-email').value = 'john@plumbing.com';
        document.getElementById('login-password').value = 'john123';
        showAlert('John Doe (Provider) credentials loaded. Click "Sign In" to proceed.', true);
      });
    }

    if (demoAdminBtn) {
      demoAdminBtn.addEventListener('click', () => {
        document.getElementById('login-email').value = 'admin@services.com';
        document.getElementById('login-password').value = 'admin123';
        showAlert('System Admin credentials loaded. Click "Sign In" to proceed.', true);
      });
    }

    function showAlert(msg, isSuccess = false) {
      alertBox.style.display = 'block';
      alertBox.style.background = isSuccess ? 'rgba(46, 196, 182, 0.15)' : 'rgba(230, 57, 70, 0.15)';
      alertBox.style.color = isSuccess ? 'var(--success)' : 'var(--danger)';
      alertBox.style.border = `1px solid ${isSuccess ? 'var(--success)' : 'var(--danger)'}`;
      alertBox.textContent = msg;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          if (res.status === 404 || res.status === 500) {
            throw new Error(data.error || 'Login failed.');
          }
          throw new Error(data.error || 'Invalid credentials.');
        }

        localStorage.setItem('apex_token', data.token);
        localStorage.setItem('apex_user', JSON.stringify(data.user));

        showAlert('Login successful! Redirecting...', true);
        setTimeout(() => {
          if (data.user.role === 'customer') window.location.href = '/index.html#customer-dashboard';
          else if (data.user.role === 'provider') window.location.href = '/index.html#provider-dashboard';
          else if (data.user.role === 'admin') window.location.href = '/index.html#admin-dashboard';
          else window.location.href = '/index.html';
        }, 500);

      } catch (err) {
        const users = JSON.parse(localStorage.getItem('apex_users') || '[]');
        const user = users.find(u => u.email === email && u.password === password);

        if (user) {
          const token = Math.random().toString(36).substring(2);
          localStorage.setItem('apex_token', token);
          localStorage.setItem('apex_user', JSON.stringify({ id: user.id, name: user.name, email: user.email, role: user.role }));
          
          showAlert('Offline mode login successful! Redirecting...', true);
          setTimeout(() => {
            if (user.role === 'customer') window.location.href = '/index.html#customer-dashboard';
            else if (user.role === 'provider') window.location.href = '/index.html#provider-dashboard';
            else if (user.role === 'admin') window.location.href = '/index.html#admin-dashboard';
            else window.location.href = '/index.html';
          }, 500);
        } else {
          showAlert(err.message || 'Invalid email or password.', false);
        }
      }
    });

    // ------------------- Google Identity Services -------------------
    let googleInitialized = false;
    async function initGoogleSignIn() {
      try {
        const res = await fetch('/api/auth/google/client-id');
        const data = await res.json();
        if (!data.clientId) {
          console.warn('GOOGLE_CLIENT_ID is not configured on the server.');
          return;
        }
        if (!window.google || !window.google.accounts) {
          return setTimeout(initGoogleSignIn, 300);
        }

        const loadEl = document.getElementById('g_id_onload');
        if (loadEl) loadEl.setAttribute('data-client_id', data.clientId);

        window.google.accounts.id.initialize({
          client_id: data.clientId,
          callback: handleGoogleCredential,
          auto_select: false,
          cancel_on_tap_outside: true
        });

        window.google.accounts.id.renderButton(
          document.querySelector('.g_id_signin'),
          {
            type: 'standard',
            size: 'large',
            theme: 'outline',
            text: 'continue_with',
            shape: 'rectangular',
            width: 400
          }
        );

        googleInitialized = true;
      } catch (err) {
        console.error('Google sign-in init failed:', err);
      }
    }

    async function handleGoogleCredential(response) {
      if (!response || !response.credential) {
        showAlert('Google did not return a credential. Please try again.');
        return;
      }

      try {
        showAlert('Verifying your Google account...', true);
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Google sign-in failed.');
        }

        localStorage.setItem('apex_token', data.token);
        localStorage.setItem('apex_user', JSON.stringify(data.user));

        showAlert('Google sign-in successful! Redirecting...', true);
        setTimeout(() => {
          if (data.user.role === 'customer') window.location.href = '/index.html#customer-dashboard';
          else if (data.user.role === 'provider') window.location.href = '/index.html#provider-dashboard';
          else if (data.user.role === 'admin') window.location.href = '/index.html#admin-dashboard';
          else window.location.href = '/index.html';
        }, 500);
      } catch (err) {
        showAlert(err.message || 'Google sign-in failed.', false);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(initGoogleSignIn, 150);
    });
    window.addEventListener('load', () => {
      if (!googleInitialized) setTimeout(initGoogleSignIn, 150);
    });

    function handleOAuthLogin(providerName) {
      const email = prompt(`Sign in with ${providerName}\nEnter your ${providerName} account email:`, '');
      if (!email || !email.trim()) {
        window.location.href = `/auth-${providerName.toLowerCase()}.html`;
        return;
      }
      const cleanEmail = email.trim();
      const userName = cleanEmail.split('@')[0].replace('.', ' ').replace(/(^\w|\s\w)/g, m => m.toUpperCase());
      window.location.href = `/auth-${providerName.toLowerCase()}.html?email=${encodeURIComponent(cleanEmail)}&name=${encodeURIComponent(userName)}`;
    }

    document.getElementById('btn-oauth-microsoft')?.addEventListener('click', () => handleOAuthLogin('Microsoft'));
    document.getElementById('btn-oauth-yahoo')?.addEventListener('click', () => handleOAuthLogin('Yahoo'));
  </script>
</body>
</html>
