<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="On-Demand Service Booking and Management System - Hire local professionals easily.">
  <title>ApexServices | On-Demand Booking & Service Management</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap"
    rel="stylesheet">
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <!-- Loading Glass Overlay -->
  <div id="global-loader" class="loader-overlay hidden">
    <div class="spinner"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main Container -->
  <div class="app-container">

    <!-- Premium Header -->
    <header class="main-header">
      <div class="header-content container">
        <a href="/" class="logo-container" id="nav-logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
          <span class="logo-text">Apex<span class="highlight">Services</span></span>
        </a>

        <!-- Navigation Menu -->
        <nav class="navbar" id="navbar-menu">
          <a href="#" class="nav-link active" data-view="home">Home</a>
          <a href="#" class="nav-link" data-view="services">Services</a>
          <a href="/categories.html" class="nav-link">Categories</a>
          <a href="/about.html" class="nav-link">About</a>
        </nav>

        <!-- Right User Actions Section -->
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme" style="background:rgba(255,255,255,0.08); border:1px solid var(--border-glass); color:var(--text-white); width:38px; height:38px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;">🌙</button>
          <div class="auth-actions" id="auth-actions-container">
            <a href="/register.html" class="btn btn-quiet">Register</a>
            <a href="/login.html" class="btn btn-primary">Login</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Dynamic Main Content Viewport -->
    <main id="app-root" class="main-content">
      <!-- Dynamically filled by app.js -->
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <div class="footer-content container">
        <div class="footer-brand">
          <div class="logo-container">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
            </svg>
            <span class="logo-text">Apex<span class="highlight">Services</span></span>
          </div>
          <p>Premium On-Demand Solutions for Home, Appliance, Beauty, and Repairs.</p>
        </div>
        <div class="footer-links">
          <h4>Services</h4>
          <ul>
            <li><a href="#" class="footer-category-link" data-category="Cleaning">Home Cleaning</a></li>
            <li><a href="#" class="footer-category-link" data-category="Plumbing">Plumbing</a></li>
            <li><a href="#" class="footer-category-link" data-category="Electrical">Electrical Works</a></li>
            <li><a href="#" class="footer-category-link" data-category="Beauty & Wellness">Beauty & Salon</a></li>
          </ul>
        </div>
        <div class="footer-copy">
          <p>&copy; 2026 ApexServices Inc. All rights reserved. Crafted with excellence.</p>
        </div>
      </div>
    </footer>
  </div>

  <!-- Modular Scripts -->
  <script type="module" src="/app.js"></script>
</body>

</html>
