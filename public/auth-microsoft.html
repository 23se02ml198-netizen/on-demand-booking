<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to your Microsoft account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; }
    body {
      background: linear-gradient(135deg, #eef2f5 0%, #e6ebf0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1b1b1b;
    }
    .auth-card {
      background: #ffffff;
      width: 440px;
      padding: 44px;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }
    .ms-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #1b1b1b;
      margin-bottom: 8px;
    }
    p.subtext {
      font-size: 15px;
      color: #505050;
      margin-bottom: 24px;
    }
    .user-tile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid #0067b8;
      background: #f2f2f2;
      border-radius: 2px;
      margin-bottom: 24px;
      cursor: pointer;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #0067b8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    .user-name { font-weight: 600; font-size: 14px; color: #1b1b1b; }
    .user-email { font-size: 12px; color: #505050; }
    .btn-ms {
      width: 100%;
      background: #0067b8;
      color: white;
      border: none;
      padding: 10px 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s;
    }
    .btn-ms:hover { background: #005da6; }
    .footer-links {
      margin-top: 36px;
      font-size: 12px;
      color: #505050;
      display: flex;
      gap: 16px;
    }
    .footer-links a { color: #505050; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="ms-logo">
      <svg width="24" height="24" viewBox="0 0 23 23">
        <path fill="#f35325" d="M1 1h10v10H1z"/>
        <path fill="#81bc06" d="M12 1h10v10H1z"/>
        <path fill="#05a6f0" d="M1 12h10v10H1z"/>
        <path fill="#ffba08" d="M12 12h10v10H1z"/>
      </svg>
      <span style="font-weight: 600; font-size: 18px; color: #737373;">Microsoft</span>
    </div>

    <h1>Sign in</h1>
    <p class="subtext">to continue to <strong>ApexServices</strong></p>

    <div class="user-tile" id="tile-account">
      <div class="user-avatar">J</div>
      <div>
        <div class="user-name">John Doe</div>
        <div class="user-email">john.doe@outlook.com</div>
      </div>
    </div>

    <button class="btn-ms" id="btn-login-ms">Sign in as John Doe</button>

    <div class="footer-links">
      <a href="#">Terms of use</a>
      <a href="#">Privacy & cookies</a>
    </div>
  </div>

  <script>
    document.getElementById('tile-account').addEventListener('click', doAuth);
    document.getElementById('btn-login-ms').addEventListener('click', doAuth);

    async function doAuth() {
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'john@plumbing.com', password: 'john123' })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('apex_token', data.token);
          localStorage.setItem('apex_user', JSON.stringify(data.user));
          window.location.href = '/index.html';
        } else {
          alert('Authentication failed.');
        }
      } catch(e) {
        alert('Server connection error.');
      }
    }
  </script>
</body>
</html>
